openapi: 3.1.0
info:
  title: "Merită lansat? — AI marketing kit API for eMAG sellers"
  version: 2.0.0
  summary: "Turns a product idea into a full launch marketing kit: market insight, personas, positioning, copy, campaign plan, A/B tests and AI-generated + AI-edited short videos."
  description: |
    ## What the product does
    A small eMAG.ro seller writes **one free-text prompt** (Romanian) and can attach **product photos**. There is no form.
    The backend:

    0. **Understands the request**: a vision model reads the prompt and photos and extracts the product name, eMAG search
       keyword (plus an English term and a few subreddits for the web sources), description, brand, price and ad budget. When something is missing (typically price or budget) the campaign
       pauses in status `needs_input` with **questions** for the seller. The AI never guesses price or budget. Quick answers
       come from market data (eMAG price quartiles), and skipped questions fall back to the eMAG median price and a default budget.
    1. **Understands the market**: scrapes the first eMAG search page (~60 competitors: price, rating,
       reviews) and the 8 most-reviewed product pages (seller and reviews), and reads Google Trends for Romania over 5 years.
       Outside eMAG, best effort: the first Amazon.de search page (international prices and ratings), Reddit posts and
       comments from 2–3 niche subreddits picked by the intake (through the Arctic Shift archive), and new products on
       BetaList. A source that is blocked or down is skipped; `web.sources[]` says what happened to each one.
    2. **Finds the audience**: 2–3 personas (who buys, what motivates them, where they spend time online).
    3. **Chooses the positioning**: turns competitor complaints into messages. If everyone complains about the battery,
       the message becomes "battery tested for 8 hours".
    4. **Generates content**: listing titles and description, 3–5 ad variants, social media posts, image ideas, and
       short-video concepts split into shots.
    5. **Plans the campaign**: channels, budget per channel and a 4-week calendar.
    6. **Proposes A/B tests**: e.g. "message A (battery) vs message B (warm light)", plus which metric to watch.
    7. **Makes videos**: each shot of a video concept becomes a clip generated by an OpenRouter video model (cheapest
       suitable by default, `x-ai/grok-imagine-video-1.5-lite`, $0.02/s at 480p 9:16; the seller's product photo can be the
       first frame). An **AI video editor** then writes Python editing scripts (captions, transitions, end card with the price)
       that run in an isolated sandbox, and delivers a finished vertical reel.

    **Numbers are computed by code, not by the AI**: market statistics, budget split (normalised to 100%), estimated
    impressions, clicks, orders, revenue and ROAS (from fixed channel benchmarks), and A/B test sample size, cost and duration.
    The AI writes strategy and copy only. Every response includes the real cost of producing it (cost vs value).

    Money is **RON (lei)** unless a field ends in `_usd`. Percentages are 0–100. User-facing texts are **Romanian**.
    Video prompts (`video_prompt`, `generation_prompt`) are English because the models work best in English.

    ## Frontend guide

    ### 1. Prompt
    - One textarea plus an image picker (up to 5 images, max 8 MB each). `GET /api/demo-cases` gives example prompts
      to prefill the textarea.
    - Submit with `POST /api/campaigns` as `multipart/form-data` (`prompt` field, one `images` part per photo). Without
      photos, you can also send JSON `{ "prompt": "..." }`. It returns **202** immediately with a `Kit` in status `running`.
    - Photos are stored as `product_image` uploads (see `GET /api/campaigns/{id}/assets`). The first photo is also used as the
      first video frame.

    ### 2. Questions (status `needs_input`)
    - Poll `GET /api/campaigns/{id}` every ~2 s. When `status` is `needs_input`, render `intake.questions` as a small
      chat/form card:
      - `text` = the question (Romanian). `hint` = code-written context, e.g. the eMAG median price (show it under the field).
      - `kind: number` → numeric input with `unit` (lei). `kind: text` → text input.
      - `options` → quick-answer chips; clicking one fills `value`.
      - `required: false` → show a "Sari peste" (skip) button.
    - Send `POST /api/campaigns/{id}/answers` with `{ "answers": [{ "question_id", "value" } | { "question_id", "skip": true }],
      "message": "optional extra info" }`. The response is **202** with the kit back in `running`; continue polling. There are at
      most 3 rounds of questions, and usually one or none.
    - Show `intake.answers` as the dialogue history, and `intake.assumptions` as a notice on the kit (defaults used for skipped
      questions).
    - The `market` / `trend` / `web` sections may already be filled while questions are pending, so you can render them behind the card.

    ### 3. Progress → kit
    - While `status` is `running`, `steps[]` gives each stage's status (`intake` → `market` → `strategy` → `content` → `plan`;
      `intake` is `waiting` while questions are pending). Sections (`market`, `trend`, `web`, `strategy`, `content`, `plan`) are `null`
      until their step completes, so **render them progressively**. A full kit takes ~30–90 s with a real model.
    - `input` holds what the AI understood (`product_name`, `keyword`, `sale_price`, `ad_budget_ron`, …). Show it as a
      summary card ("Am înțeles: …").
    - `status: failed` → show `error`.
    - Suggested tabs:
      - **Piața**: `market.stats` (price histogram, median vs `input.sale_price` via `market.price_vs_median_pct`,
        `avg_rating`, `top_sellers`), competitors table, `trend.monthly` line chart and `trend.stats.direction`. Show
        `fallback_note` when the data is not live.
      - **În afara eMAG** (`web`, filled by the `market` step): `web.stats.amazon` (Amazon median in lei vs the eMAG median via
        `emag_vs_amazon_pct`), the `web.amazon` table, `web.discussions` as Reddit quote cards linking to `url`,
        `web.stats.reddit.subreddits` as a small bar chart, and `web.launches` as "produse noi" cards. Render each source from
        `web.sources[]`: when `status` is not `ok`, show its `note` (Romanian) instead of an empty table. Amazon is often
        `blocked`, and that's expected.
      - **Public**: `strategy.personas` as cards; `strategy.complaints` with quotes (badge from `source`: eMAG reviews / Reddit / both).
      - **Poziționare**: `strategy.positioning` (statement, main message, tone, complaint → message table).
      - **Conținut**: listing (3 title options with copy buttons, description, bullets, keywords), ads grouped by channel
        and persona, social posts, image ideas.
      - **Video**: `content.video_concepts` with shots. See section 3.
      - **Campanie**: `plan.channels` (donut of `share_pct` plus a table of budget, impressions, clicks, orders, ROAS),
        `plan.totals`, a 4-week calendar (`plan.calendar`, where `content_refs` link to `adN` / `vN`), `plan.ab_tests`
        with `sizing` (sample per variant, cost, days, `feasible_in_campaign`), and `plan.kpis`.
      - **Cost**: `cost` → "Kitul a costat {total_cost_ron} lei = {cost_pct_of_budget}% din bugetul de reclame".
    - Budget sliders: `POST /api/campaigns/{id}/budget-simulation` (instant, deterministic).

    ### 4. Videos
    1. Photos attached to the prompt are already uploads. Optionally upload another product photo with
       `POST /api/campaigns/{id}/uploads` (multipart: `file`, `role=product_image`); the latest one becomes the first
       frame of the first shot. Music (`role=music`), a logo and extra footage can also be uploaded
       for the editor.
    2. `GET /api/video-models` lists models with price per second. Show the estimated cost before generating.
    3. `POST /api/campaigns/{id}/videos` with `{ "concept_id": "v1" }` → **202** with one `Asset` per shot (status `pending`).
       Poll `GET /api/campaigns/{id}/assets` every ~5 s. Generation takes ~30 s to a few minutes. When `status` is
       `completed`, play `content_url` in a `<video>` tag (Range requests supported).
    4. `POST /api/campaigns/{id}/edits` with `{ "concept_id": "v1" }` (optional `instructions` in Romanian, e.g.
       "fă-l de 15 secunde, cu muzica încărcată") → **202** `Edit` in status `running`. Poll `GET /api/edits/{id}` every
       ~2 s and show `steps[]` as a live log: `script` = the Python code the AI wrote (render as code), `result` = run outcome,
       `finish` = done. When `status` is `completed`, `output_asset_id` points to the final video
       (`GET /api/assets/{id}` → `content_url`). Typical time: 30–120 s.

    ### 5. Chat
    `GET/POST /api/campaigns/{id}/messages` (only once the kit is `completed`). The assistant rewrites copy and answers
    questions. For budget what-ifs it runs the deterministic simulator and returns `simulations`. Streaming:
    send `Accept: text/event-stream` and read events `token` `{text}`, `simulation` (`BudgetSimulation`), `done` (`ChatReply`)
    and `error` with `fetch()` plus a stream reader.

    ### Media URLs
    `content_url` is relative to the API origin (e.g. `http://localhost:8080` + `/api/assets/{id}/content`). Add `?download=1`
    to force a download.

    ## Errors
    `{"error": {"code", "message"}}`. Codes: `invalid_request` (400), `not_found` (404), `not_ready` (409: kit still generating
    or asset not finished), `not_waiting` (409: answers posted while no questions are pending), `no_market_data` (422), `ai_unavailable` (503: server has no OpenRouter key), `ai_error` (502),
    `timeout` (504), `internal` (500).

    ## CORS
    All origins are allowed by default. Methods: GET, POST, DELETE, OPTIONS. `Range` is allowed and `Content-Range` is exposed.
servers:
  - url: http://localhost:8080
    description: Local development
security: []  # hackathon demo: no authentication
tags:
  - name: Meta
    description: Health, docs, methodology, demo presets, video model catalog.
  - name: Market
    description: Raw eMAG and Google Trends data for a keyword.
  - name: Campaigns
    description: Create and read marketing kits; budget simulation.
  - name: Media
    description: Uploads, AI-generated video clips, AI video editing, file streaming.
  - name: Chat
    description: AI chat about a kit, with deterministic budget simulations.

paths:
  /api/health:
    get:
      tags: [Meta]
      summary: Health and configuration
      operationId: getHealth
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unreachable (same body, status = degraded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/openapi.yaml:
    get:
      tags: [Meta]
      summary: This document
      operationId: getOpenAPI
      responses:
        "200":
          description: YAML.
          content:
            application/yaml:
              schema: { type: string }

  /api/methodology:
    get:
      tags: [Meta]
      summary: How numbers are computed (benchmarks, formulas; Romanian text)
      operationId: getMethodology
      responses:
        "200":
          description: Methodology.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Methodology" }

  /api/demo-cases:
    get:
      tags: [Meta]
      summary: Preset form inputs for the demo (backed by precollected market data)
      operationId: listDemoCases
      responses:
        "200":
          description: Demo cases.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DemoCase" }

  /api/video-models:
    get:
      tags: [Meta]
      summary: OpenRouter video models with prices, cheapest first
      description: Live catalog from OpenRouter (cached 1 h). Token-priced models have an empty `price_per_second_usd` and a null `cheapest_per_second_usd`.
      operationId: listVideoModels
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoModelList" }
        "502": { $ref: "#/components/responses/AIError" }

  /api/market:
    get:
      tags: [Market]
      summary: eMAG market data for a keyword (cache → live scrape → seed)
      operationId: getMarket
      parameters:
        - name: keyword
          in: query
          required: true
          schema: { type: string, example: suport laptop }
      responses:
        "200":
          description: Market snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/NoMarketData" }

  /api/trends:
    get:
      tags: [Market]
      summary: Google Trends (Romania, 5 years, weekly)
      description: Never fails; when there is no data, `points` is empty and `fallback_note` explains why.
      operationId: getTrends
      parameters:
        - name: keyword
          in: query
          required: true
          schema: { type: string, example: suport laptop }
      responses:
        "200":
          description: Trend series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/web:
    get:
      tags: [Market]
      summary: Amazon, Reddit and BetaList data for an English query (cache → live, best effort)
      description: "Never fails because of a source: each one reports its status in `sources[]`. Cached for 24 h per query + subreddits."
      operationId: getWeb
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, example: laptop stand }
        - name: subreddits
          in: query
          description: "Comma-separated subreddit names without r/ (max 3 used). Without it, Reddit is skipped."
          schema: { type: string, example: "ergonomics,laptops" }
        - name: emag_median
          in: query
          description: "eMAG median price in lei, to fill `stats.amazon.emag_vs_amazon_pct`."
          schema: { type: number }
      responses:
        "200":
          description: Web snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/campaigns:
    post:
      tags: [Campaigns]
      summary: Start generating a marketing kit (async)
      description: |
        The seller sends only a free-text prompt plus optional product images. Returns 202 immediately; poll
        GET /api/campaigns/{id}. The kit may move to `needs_input` with questions (answer with POST /api/campaigns/{id}/answers).
        Requires the server to have an OpenRouter key.
      operationId: createCampaign
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CampaignCreateMultipart" }
            encoding:
              images: { contentType: "image/*" }
          application/json:
            schema: { $ref: "#/components/schemas/CampaignCreate" }
            example:
              prompt: "Vreau să vând pe eMAG un suport de laptop pliabil din aluminiu, 6 trepte de înălțime, 280 g. Îl vând cu 79 de lei și am 2000 de lei de reclame."
      responses:
        "202":
          description: Kit created with status `running`. The `Location` header points to the kit.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/AIUnavailable" }
    get:
      tags: [Campaigns]
      summary: List kits (newest first)
      operationId: listCampaigns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Page of kits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignList" }

  /api/campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Campaigns]
      summary: Get a kit (poll this while status is running)
      operationId: getCampaign
      responses:
        "200":
          description: The kit; sections are null until generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kit" }
              examples:
                completed: { $ref: "#/components/examples/KitCompleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Campaigns]
      summary: Delete a kit with all its media, edits and chat
      operationId: deleteCampaign
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campaigns/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Campaigns]
      summary: Answer the AI's questions and resume generation (async)
      description: |
        Only when the kit `status` is `needs_input`. Every pending question in `intake.questions` should be answered or
        skipped. Questions left out count as skipped. Questions with `required: true` cannot be skipped. Returns 202 with the
        kit in status `running`; keep polling GET /api/campaigns/{id} (it may ask again, max 3 rounds).
      operationId: answerQuestions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
            example: { answers: [{ question_id: q1_1, value: "49" }, { question_id: q1_2, skip: true }], message: "Se vând mai ales cadou." }
      responses:
        "202":
          description: Answers recorded; kit back to `running`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The kit is not waiting for answers (not_waiting)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /api/campaigns/{id}/budget-simulation:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Campaigns]
      summary: What-if for budget and channel split (deterministic, instant)
      description: Omitted fields keep the kit's values. Shares are normalised to 100%. Does not modify the kit.
      operationId: simulateBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetSimulationRequest" }
            example: { total_budget_ron: 3000, shares: { meta: 50, tiktok: 30, emag_ads: 20 } }
      responses:
        "200":
          description: Simulation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campaigns/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Media]
      summary: All media of a kit (uploads, generated clips, edited videos), oldest first
      description: Poll every ~5 s while any generated clip is `pending` / `in_progress`.
      operationId: listAssets
      responses:
        "200":
          description: Assets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campaigns/{id}/uploads:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Media]
      summary: Upload a product photo, logo, music or footage (max 100 MB)
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, role]
              properties:
                file:
                  type: string
                  format: binary
                role:
                  $ref: "#/components/schemas/UploadRole"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/campaigns/{id}/videos:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Media]
      summary: Generate video clips with an OpenRouter video model (async)
      description: |
        Either `concept_id` (one clip per shot, using each shot's `video_prompt` and `duration_s`) or a free `prompt`.
        Durations snap to the closest one the model supports. The product photo (latest `product_image` upload; prompt images are
        such uploads) becomes the first frame of the first shot when `use_product_image` is true (default)
        and the model supports it. Max 6 clips per request.
      operationId: generateVideos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoRequest" }
            examples:
              concept: { value: { concept_id: v1 } }
              custom: { value: { prompt: "slow orbit around an aluminium laptop stand on a white desk, soft daylight", duration_s: 5 } }
      responses:
        "202":
          description: One asset per clip (status pending; failed if the submit was rejected).
          content:
            application/json:
              schema:
                type: object
                required: [items, estimated_cost_usd]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
                  estimated_cost_usd: { type: number, description: "Estimate from the model's price list (0 for token-priced models). Real cost appears on each asset when done." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /api/campaigns/{id}/edits:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Media]
      summary: Editing sessions of a kit (newest first)
      operationId: listEdits
      responses:
        "200":
          description: Edits.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Edit" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Media]
      summary: Start an AI video-editing session (async)
      description: |
        An LLM writes Python (ffmpeg plus the `vidkit` helpers) that runs in an isolated sandbox. It inspects the results,
        fixes its own errors, and delivers a final video. Inputs default to the completed clips of `concept_id` (or all
        completed clips) plus all uploads.
      operationId: startEdit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditRequest" }
            example: { concept_id: v1, instructions: "Reel de 15 secunde, cu muzica încărcată, ultimul cadru cu prețul.", target_duration_s: 15 }
      responses:
        "202":
          description: Session started (status running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /api/edits/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Media]
      summary: Get an editing session (poll while running)
      operationId: getEdit
      responses:
        "200":
          description: Edit session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Media]
      summary: Get one asset
      operationId: getAsset
      responses:
        "200":
          description: Asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets/{id}/content:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: download
        in: query
        schema: { type: string, enum: ["1"] }
        description: Set to 1 to send Content-Disposition attachment.
      - name: Range
        in: header
        schema: { type: string }
        description: Byte range (used by video players for seeking).
    get:
      tags: [Media]
      summary: Stream the file (video/mp4, image/*, audio/*)
      operationId: getAssetContent
      responses:
        "200":
          description: Whole file.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: Partial content (Range request).
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReady" }

  /api/campaigns/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Chat]
      summary: Chat history (oldest first)
      operationId: listMessages
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Chat]
      summary: Ask the marketing assistant (JSON or Server-Sent Events)
      description: |
        Only for completed kits. Send `Accept: text/event-stream` to stream:

        ```
        event: token
        data: {"text":"Cu 3000 de lei "}

        event: simulation
        data: { ...BudgetSimulation... }

        event: done
        data: { ...ChatReply... }
        ```

        On failure mid-stream: `event: error`, `data: {"code":"ai_error","message":"..."}`.
      operationId: postMessage
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
            enum: [application/json, text/event-stream]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 4000, example: "Rescrie reclama ad2 pentru studenți, mai amuzant." }
      responses:
        "200":
          description: "Reply (JSON), or an SSE stream when Accept is text/event-stream."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReply" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReady" }
        "502": { $ref: "#/components/responses/AIError" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: "Invalid input (invalid_request)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_request, message: "aspect ratio 21:9 not supported by x-ai/grok-imagine-video-1.5-lite (supported: [16:9 9:16 1:1 4:3 3:4 3:2 2:3])" } }
    NotFound:
      description: "Not found (not_found)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: "Kit still generating or asset not finished (not_ready)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoMarketData:
      description: "No eMAG results and no precollected data (no_market_data)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AIUnavailable:
      description: "Server has no OpenRouter key (ai_unavailable)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AIError:
      description: "AI provider error (ai_error)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [invalid_request, not_found, not_ready, not_waiting, no_market_data, ai_unavailable, ai_error, timeout, internal] }
            message: { type: string }

    Health:
      type: object
      required: [status, database, video_worker, ai_configured, ai_model, video_model, editor_model, scraper_enabled, trends_enabled]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, description: '"ok" or an error' }
        video_worker: { type: string, description: '"ok" or an error (editing unavailable when not ok)' }
        ai_configured: { type: boolean, description: "False → campaigns, videos, editing and chat return 503." }
        ai_model: { type: string }
        video_model: { type: string }
        editor_model: { type: string }
        scraper_enabled: { type: boolean }
        trends_enabled: { type: boolean }

    Methodology:
      type: object
      required: [principle, channel_benchmarks, constants, steps]
      properties:
        principle: { type: string }
        channel_benchmarks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Benchmark" }
        constants:
          type: object
          additionalProperties: { type: number }
        steps: { type: array, items: { type: string } }

    Benchmark:
      type: object
      required: [label, cpm_ron, ctr_pct, cvr_pct]
      properties:
        label: { type: string }
        cpm_ron: { type: number, description: "Cost per 1000 impressions, lei." }
        ctr_pct: { type: number, description: "Click-through rate, %." }
        cvr_pct: { type: number, description: "Click → order conversion, %." }

    DemoCase:
      type: object
      required: [id, title, description, prompt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, description: "What the demo shows (e.g. whether the AI will ask questions)." }
        prompt: { type: string, description: "Example prompt to prefill the textarea." }

    Channel:
      type: string
      enum: [emag_ads, meta, tiktok, google_ads]
      description: "Paid channels. meta = Facebook + Instagram."

    OnlineChannel:
      type: string
      enum: [facebook, instagram, tiktok, youtube, google_search, emag, forums, pinterest]
      description: Where a persona spends time online.

    DataSource:
      type: string
      enum: [live, cache, seed, none]
      description: "live = fetched now; cache = fetched live in the last 24 h; seed = precollected demo data; none = no data (trends only)."

    CampaignCreate:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, maxLength: 4000, description: "Free text (Romanian): what the product is, and optionally price, budget, brand and what makes it special." }

    CampaignCreateMultipart:
      type: object
      properties:
        prompt: { type: string, maxLength: 4000, description: "Required unless at least one image is sent." }
        images:
          type: array
          maxItems: 5
          description: "Product photos (image/*, max 8 MB each). Repeat the `images` field once per file."
          items: { type: string, format: binary }

    KitInput:
      type: object
      description: "The product brief: `prompt` and `image_asset_ids` come from the seller; the other fields are what the AI understood (empty / 0 until known)."
      required: [prompt, image_asset_ids, product_name, keyword, keyword_en, subreddits, sale_price, ad_budget_ron]
      properties:
        prompt: { type: string }
        image_asset_ids: { type: array, items: { type: string, format: uuid }, description: "Assets (kind upload, role product_image) created from the prompt images." }
        product_name: { type: string }
        keyword: { type: string, description: "eMAG search term used for market data." }
        keyword_en: { type: string, description: "English search term used for Amazon, Reddit and BetaList." }
        subreddits: { type: array, maxItems: 3, items: { type: string }, description: "Subreddits searched for discussions (names without r/)." }
        product_description: { type: string, description: "From the prompt, the photos and the answers. The AI only claims what is written here." }
        sale_price: { type: number, description: "Lei incl. VAT; 0 until known." }
        ad_budget_ron: { type: number, description: "Total paid ads budget for the 4-week campaign, lei." }
        brand_name: { type: string }

    IntakeField:
      type: string
      enum: [product_name, keyword, sale_price, ad_budget_ron, product_description, brand_name, other]

    QuestionOption:
      type: object
      required: [label, value]
      properties:
        label: { type: string, example: "71 lei (median eMAG)" }
        value: { type: string, example: "71", description: "Send this as the answer value." }

    Question:
      type: object
      required: [id, field, text, kind, required, options]
      properties:
        id: { type: string, example: q1_1 }
        field: { $ref: "#/components/schemas/IntakeField" }
        text: { type: string, description: "The question, in Romanian." }
        kind: { type: string, enum: [number, text] }
        unit: { type: string, example: lei }
        required: { type: boolean, description: "false = may be skipped (a default is used and noted in intake.assumptions)." }
        hint: { type: string, description: "Code-written context, e.g. the eMAG median price and what happens if skipped." }
        options: { type: array, items: { $ref: "#/components/schemas/QuestionOption" }, description: "Quick answers (may be empty)." }

    Answer:
      type: object
      required: [question_id, field, question, value, skipped, round, at]
      properties:
        question_id: { type: string, description: "Empty for the free-text message." }
        field: { $ref: "#/components/schemas/IntakeField" }
        question: { type: string }
        value: { type: string }
        skipped: { type: boolean }
        round: { type: integer }
        at: { type: string, format: date-time }

    IntakeBlock:
      type: object
      required: [round, questions, answers, assumptions]
      properties:
        round: { type: integer, description: "Question rounds asked so far (max 3)." }
        questions: { type: array, items: { $ref: "#/components/schemas/Question" }, description: "Pending questions; non-empty only while status is needs_input." }
        answers: { type: array, items: { $ref: "#/components/schemas/Answer" }, description: "Dialogue history, oldest first." }
        assumptions: { type: array, items: { type: string }, description: "Defaults applied for skipped questions (Romanian), shown as a notice." }

    AnswerRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id: { type: string }
              value: { type: string, maxLength: 1000, description: "Free text; amounts like \"79\", \"79,90 lei\" or \"2 mii\" are parsed by the server." }
              skip: { type: boolean, default: false }
        message: { type: string, maxLength: 4000, description: "Optional extra information for the AI." }

    StepInfo:
      type: object
      required: [step, status, duration_ms]
      properties:
        step: { type: string, enum: [intake, market, strategy, content, plan] }
        status: { type: string, enum: [pending, running, waiting, completed, failed], description: "waiting = intake paused for questions." }
        duration_ms: { type: integer }

    Product:
      type: object
      required: [id, title, url, price, rating, review_count, position]
      properties:
        id: { type: string, description: "eMAG product code (PNK)." }
        title: { type: string }
        url: { type: string, format: uri }
        image_url: { type: string, format: uri }
        category: { type: string }
        brand: { type: string }
        seller: { type: string, description: "Only known for the 8 most-reviewed listings." }
        price: { type: number }
        rating: { type: number }
        review_count: { type: integer }
        position: { type: integer }

    Review:
      type: object
      required: [product_id, rating, text]
      properties:
        product_id: { type: string }
        rating: { type: integer }
        text: { type: string }
        date: { type: string, format: date }

    SellerStat:
      type: object
      required: [name, product_count, review_count, review_share_pct]
      properties:
        name: { type: string }
        product_count: { type: integer }
        review_count: { type: integer }
        review_share_pct: { type: number }

    PriceBucket:
      type: object
      required: [from, to, count]
      properties:
        from: { type: number }
        to: { type: number }
        count: { type: integer }

    MarketStats:
      type: object
      required: [competitor_count, known_seller_count, price_min, price_p25, price_median, price_p75, price_max, price_avg, avg_rating, total_reviews, top3_review_share_pct, est_market_units_month, top_sellers, price_histogram]
      properties:
        competitor_count: { type: integer }
        known_seller_count: { type: integer }
        price_min: { type: number }
        price_p25: { type: number }
        price_median: { type: number }
        price_p75: { type: number }
        price_max: { type: number }
        price_avg: { type: number }
        avg_rating: { type: number, description: "Review-weighted." }
        total_reviews: { type: integer }
        top3_review_share_pct: { type: number }
        est_market_units_month: { type: number, description: "Estimated units/month sold by these listings (reviews / 24 months / 2%)." }
        top_sellers: { type: array, items: { $ref: "#/components/schemas/SellerStat" } }
        price_histogram: { type: array, items: { $ref: "#/components/schemas/PriceBucket" } }

    YearAvg:
      type: object
      required: [year, value]
      properties:
        year: { type: integer }
        value: { type: number }

    TrendStats:
      type: object
      required: [direction, yoy_change_pct, last_12_month_avg, prev_12_month_avg, yearly]
      properties:
        direction: { type: string, enum: [rising, stable, declining, unknown] }
        yoy_change_pct: { type: number }
        last_12_month_avg: { type: number }
        prev_12_month_avg: { type: number }
        peak_month: { type: string, description: '"01"-"12"' }
        yearly: { type: array, items: { $ref: "#/components/schemas/YearAvg" } }

    MonthPoint:
      type: object
      required: [month, value]
      properties:
        month: { type: string, description: "YYYY-MM" }
        value: { type: number, description: "0-100 relative interest." }

    TrendPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: integer }

    MarketBlock:
      type: object
      required: [source, fetched_at, stats, reviews_analyzed, price_vs_median_pct, competitors]
      properties:
        source: { $ref: "#/components/schemas/DataSource" }
        fetched_at: { type: string, format: date-time }
        fallback_note: { type: string }
        stats: { $ref: "#/components/schemas/MarketStats" }
        reviews_analyzed: { type: integer }
        price_vs_median_pct: { type: number, description: "Seller price vs market median, % (+ = more expensive)." }
        competitors: { type: array, description: "Top 12 by reviews.", items: { $ref: "#/components/schemas/Product" } }

    TrendBlock:
      type: object
      required: [source, fetched_at, stats, monthly]
      properties:
        source: { $ref: "#/components/schemas/DataSource" }
        fetched_at: { type: string, format: date-time }
        fallback_note: { type: string }
        stats: { $ref: "#/components/schemas/TrendStats" }
        monthly: { type: array, items: { $ref: "#/components/schemas/MonthPoint" } }

    WebSourceStatus:
      type: object
      required: [name, status, items]
      properties:
        name: { type: string, enum: [amazon, reddit, betalist] }
        status: { type: string, enum: [ok, empty, blocked, error, disabled], description: "blocked = bot challenge or rate limit (skipped, not retried)." }
        items: { type: integer }
        note: { type: string, description: "Romanian; show it when status is not ok (or for partial Reddit results)." }

    WebProduct:
      type: object
      required: [id, title, url, price, currency, rating, review_count, sponsored, position]
      properties:
        id: { type: string, description: "Amazon ASIN." }
        title: { type: string }
        url: { type: string, format: uri }
        image_url: { type: string, format: uri }
        price: { type: number, description: "In `currency`; 0 when not shown." }
        currency: { type: string, enum: [RON, EUR, USD, GBP], description: "Amazon shows the visitor's local currency (RON from Romania)." }
        rating: { type: number }
        review_count: { type: integer }
        sponsored: { type: boolean }
        position: { type: integer }

    Discussion:
      type: object
      required: [id, kind, subreddit, text, url, score, num_comments, date]
      properties:
        id: { type: string }
        kind: { type: string, enum: [post, comment] }
        subreddit: { type: string }
        title: { type: string, description: "Posts only." }
        text: { type: string, description: "Post body (may be empty) or comment text. English, as written." }
        url: { type: string, format: uri }
        score: { type: integer }
        num_comments: { type: integer, description: "Posts only." }
        date: { type: string, format: date }

    Launch:
      type: object
      required: [id, name, tagline, url]
      properties:
        id: { type: string }
        name: { type: string }
        tagline: { type: string }
        url: { type: string, format: uri }
        image_url: { type: string, format: uri }

    AmazonStats:
      type: object
      required: [product_count, priced_count, currency, price_min, price_median, price_max, price_median_ron, avg_rating, total_reviews, sponsored_pct, emag_vs_amazon_pct]
      properties:
        product_count: { type: integer }
        priced_count: { type: integer, description: "Products priced in `currency` (the most common one)." }
        currency: { type: string }
        price_min: { type: number, description: "In `currency`." }
        price_median: { type: number }
        price_max: { type: number }
        price_median_ron: { type: number, description: "Converted with fixed rates (see /api/methodology)." }
        avg_rating: { type: number, description: "Weighted by review count." }
        total_reviews: { type: integer }
        sponsored_pct: { type: number }
        emag_vs_amazon_pct: { type: number, description: "eMAG median vs Amazon median in lei, % (+ = eMAG more expensive); 0 when unknown." }

    SubredditStat:
      type: object
      required: [name, posts, comments, score]
      properties:
        name: { type: string }
        posts: { type: integer }
        comments: { type: integer }
        score: { type: integer }

    RedditStats:
      type: object
      required: [post_count, comment_count, total_score, total_replies, last_12_months, last_12_months_pct, subreddits]
      properties:
        post_count: { type: integer }
        comment_count: { type: integer }
        total_score: { type: integer }
        total_replies: { type: integer, description: "Sum of num_comments of the matching posts." }
        last_12_months: { type: integer, description: "Posts + comments from the 12 months before the fetch." }
        last_12_months_pct: { type: number }
        first_date: { type: string, format: date }
        last_date: { type: string, format: date }
        subreddits: { type: array, items: { $ref: "#/components/schemas/SubredditStat" } }

    LaunchStats:
      type: object
      required: [found, relevant]
      properties:
        found: { type: integer, description: "Returned by BetaList search (fuzzy)." }
        relevant: { type: integer, description: "Name or tagline mentions the query." }

    WebStats:
      type: object
      required: [amazon, reddit, launches]
      properties:
        amazon: { $ref: "#/components/schemas/AmazonStats" }
        reddit: { $ref: "#/components/schemas/RedditStats" }
        launches: { $ref: "#/components/schemas/LaunchStats" }

    WebBlock:
      type: object
      required: [source, fetched_at, query, subreddits, sources, stats, amazon, discussions, launches]
      properties:
        source: { type: string, enum: [live, cache] }
        fetched_at: { type: string, format: date-time }
        query: { type: string, description: "English search term." }
        subreddits: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: "#/components/schemas/WebSourceStatus" } }
        stats: { $ref: "#/components/schemas/WebStats" }
        amazon: { type: array, description: "Top 10 by reviews.", items: { $ref: "#/components/schemas/WebProduct" } }
        discussions: { type: array, description: "Top 10 by score.", items: { $ref: "#/components/schemas/Discussion" } }
        launches: { type: array, description: "Relevant to the query, max 10.", items: { $ref: "#/components/schemas/Launch" } }

    Complaint:
      type: object
      required: [theme, mentions, severity, quotes, opportunity]
      properties:
        theme: { type: string }
        mentions: { type: integer }
        severity: { type: string, enum: [low, medium, high] }
        quotes: { type: array, items: { type: string }, description: "Real fragments from eMAG reviews or Reddit discussions, in their original language." }
        opportunity: { type: string }
        source: { type: string, enum: [emag_reviews, reddit, both], description: "Where the complaint was found. Missing on kits created before the web sources existed." }

    Persona:
      type: object
      required: [id, name, age_range, occupation, description, motivations, pain_points, channels, buying_triggers, objections, message_hook]
      properties:
        id: { type: string, example: p1 }
        name: { type: string }
        age_range: { type: string }
        occupation: { type: string }
        description: { type: string }
        motivations: { type: array, items: { type: string } }
        pain_points: { type: array, items: { type: string } }
        channels: { type: array, items: { $ref: "#/components/schemas/OnlineChannel" } }
        buying_triggers: { type: array, items: { type: string } }
        objections: { type: array, items: { type: string } }
        message_hook: { type: string }

    PositioningMessage:
      type: object
      required: [complaint_theme, message, proof_claim]
      properties:
        complaint_theme: { type: string }
        message: { type: string }
        proof_claim: { type: string, description: 'Verifiable promise, e.g. "baterie testată 8 ore".' }

    Positioning:
      type: object
      required: [statement, main_message, tone, proof_points, messages]
      properties:
        statement: { type: string }
        main_message: { type: string }
        tone: { type: string }
        proof_points: { type: array, items: { type: string } }
        messages: { type: array, items: { $ref: "#/components/schemas/PositioningMessage" } }

    Strategy:
      type: object
      required: [summary, complaints, personas, positioning]
      properties:
        summary: { type: string }
        complaints: { type: array, items: { $ref: "#/components/schemas/Complaint" } }
        personas: { type: array, items: { $ref: "#/components/schemas/Persona" } }
        positioning: { $ref: "#/components/schemas/Positioning" }

    Listing:
      type: object
      required: [titles, description, bullets, search_keywords]
      properties:
        titles: { type: array, items: { type: string }, description: "3 title options." }
        description: { type: string }
        bullets: { type: array, items: { type: string } }
        search_keywords: { type: array, items: { type: string } }

    Ad:
      type: object
      required: [id, persona_id, channel, angle, headline, primary_text, cta]
      properties:
        id: { type: string, example: ad1 }
        persona_id: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        angle: { type: string }
        headline: { type: string }
        primary_text: { type: string }
        cta: { type: string }

    SocialPost:
      type: object
      required: [channel, format, text, hashtags]
      properties:
        channel: { type: string, enum: [facebook, instagram, tiktok] }
        format: { type: string, enum: [post, reel, story, carousel] }
        text: { type: string }
        hashtags: { type: array, items: { type: string } }

    ImageIdea:
      type: object
      required: [title, description, generation_prompt]
      properties:
        title: { type: string }
        description: { type: string }
        generation_prompt: { type: string, description: "English prompt for an image model." }

    Shot:
      type: object
      required: [description, video_prompt, duration_s, caption]
      properties:
        description: { type: string, description: "Romanian, for the seller." }
        video_prompt: { type: string, description: "English prompt sent to the video model." }
        duration_s: { type: integer }
        caption: { type: string, description: "On-screen text (Romanian)." }

    VideoConcept:
      type: object
      required: [id, title, persona_id, hook, shots, end_card_lines, music_mood]
      properties:
        id: { type: string, example: v1 }
        title: { type: string }
        persona_id: { type: string }
        hook: { type: string }
        shots: { type: array, items: { $ref: "#/components/schemas/Shot" } }
        end_card_lines: { type: array, items: { type: string }, description: "First line = price." }
        music_mood: { type: string }

    Content:
      type: object
      required: [listing, ads, social_posts, image_ideas, video_concepts]
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        ads: { type: array, items: { $ref: "#/components/schemas/Ad" } }
        social_posts: { type: array, items: { $ref: "#/components/schemas/SocialPost" } }
        image_ideas: { type: array, items: { $ref: "#/components/schemas/ImageIdea" } }
        video_concepts: { type: array, items: { $ref: "#/components/schemas/VideoConcept" } }

    ChannelEstimate:
      type: object
      description: Code-computed budget and reach for a channel.
      required: [channel, label, share_pct, budget_ron, weekly_budget_ron, est_impressions, est_clicks, est_orders, est_revenue_ron, roas, cpc_ron, cpa_ron]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        label: { type: string }
        share_pct: { type: number }
        budget_ron: { type: number }
        weekly_budget_ron: { type: number }
        est_impressions: { type: integer }
        est_clicks: { type: integer }
        est_orders: { type: number }
